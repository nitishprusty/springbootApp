<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 100%;
            margin: 0;
            background-color: #FAF6E9;
        }

        .form-container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            padding: 30px;
        }

        .btn-login {
            background-color: #28a745;
            /* green */
            border-color: #28a745;
        }

        .btn-login:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="form-container">
                    <h3 class="text-center mb-4">Login</h3>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-login text-white">Login</button>
                        </div>

                        <div th:if="${param.error}" class="text-danger mt-2">
                            Invalid username or password.
                        </div>
                        <div th:if="${param.logout}" class="text-success mt-2">
                            You have been logged out.
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/register}">Don't have an account? Register</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
